# The same run as `sh tools/ci.sh`, on a runner.
#
# What this runs covers 51 of the 54 cases in `tools/acceptance.py`.
#
# The other three assert facts about RE2's own instructions (`FUN_800327ec` at 0x800327ec, the slot map at
# 0x800eb204). That needs the cartridge's **bytes** — 1.24 MB of decompressed code, which is cartridge content
# and is never committed — so those three report SKIP here, never PASS. They run wherever the cartridge exists:
# locally, and in the pre-commit hook.
#
# A way to close the gap was built and verified (M130): supply the ROM as a base64 secret, unpack, build the
# images, and the boundaries come from the committed `fixtures/decomp/ranges.json`. It was deliberately not
# adopted, because it means a copyrighted ROM living in a CI secret store. The mechanism is described in
# docs/log/M130-corpus-checks-in-ci.md if that trade is ever worth taking.
#
# Consequence, stated so nobody expects otherwise: a green CI run does NOT vouch for the three corpus checks.
name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Report what CI can and cannot see
        run: printf 'ROM present: %s\n' "$(test -f 'rom/Resident Evil 2 (USA) (Rev 1).z64' && echo yes || echo no)"
      - name: Fixtures and repository hygiene
        run: sh tools/ci.sh
