# The same run as `sh tools/ci.sh`, on a runner.
#
# Two tiers, because the cartridge is gitignored and always will be:
#
#   * without a secret  — 51 of 54 cases: every synthetic fixture, including the synthetic-cartridge corpus
#     pipeline (M129). The three checks that assert RE2's own addresses report SKIP, never PASS.
#   * with RE2_CART_B64 — 54 of 54: the cartridge is materialised, the members unpacked and the images built,
#     and the three pre-registered acceptance checks run for real. Region boundaries come from the committed
#     `fixtures/decomp/ranges.json` (M130), so nothing else needs to be smuggled in.
name: acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Report what CI can and cannot see
        run: printf 'ROM present: %s\n' "$(test -f 'rom/Resident Evil 2 (USA) (Rev 1).z64' && echo yes || echo no)"
      - name: Cartridge-dependent suites (owner-provided secret)
        env:
          RE2_CART_B64: ${{ secrets.RE2_CART_B64 }}
        run: |
          if [ -z "${RE2_CART_B64:-}" ]; then
            echo "no RE2_CART_B64 secret: the three corpus acceptance checks will SKIP (51 of 54 cases)."
            echo "Provide the cartridge as a base64 secret to get them too; see docs/log/M130."
            exit 0
          fi
          mkdir -p rom
          printf '%s' "$RE2_CART_B64" | base64 -d > "rom/Resident Evil 2 (USA) (Rev 1).z64"
          python3 tools/unpack_zlib.py rom/*.z64 --out assets/unpacked
          python3 tools/build_images.py rom/*.z64
          python3 tools/export_ranges.py --check || echo "note: fixtures/decomp/ranges.json differs from this build"

      - name: Fixtures and repository hygiene
        run: sh tools/ci.sh
